[package]
name = "game-core"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
engine = { path = "../../engine" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tracy = { version = "0.12", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"

[features]
default = []
tracy = ["dep:tracing-tracy", "engine/tracy"]
memory_profiling = []
gpu_label = ["engine/gpu_label"]
