[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
engine = {path = "../engine"}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tracy = { version = "0.11.4", optional = true }
tracy = { version = "0.2.0", optional = true }
tracy-client = { version = "0.18.4", default-features = false }

[features]
default = []
tracy = ["dep:tracing-tracy", "dep:tracy", "tracy-client/enable", "engine/tracy"]
memory_profiling = []
